<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<header style="background-color: rgb(174, 216, 250); text-align: center; color:darkblue;">
    <h1>Secure Bank Ltd.</h1>
    <p>Banking Utility Portal</p>
</header>
<body>
<hr>
    <h3>Loan Eligibility</h3>
    <label>Age: </label>
    <input type="text" id="age"><br><br>
    <label>Monthly Salary:  </label>
    <input type="number" id="salary"><br><br>
    <button onclick="checkLoanEligibility()">
    Check Eligibility
    </button>
    <p id="loanResult"></p>
<hr>

<h3>EMI Calculator</h3>

<label>Loan Amount:</label>
<input type="number" id="loan"><br><br>

<label>Interest Rate (%):</label>
<input type="number" id="rate"><br><br>

<label>Years:</label>
<input type="number" id="years"><br><br>

<button onclick="calculateEMI()">
Calculate EMI
</button>

<p id="emiResult"></p>

<hr>

<h3>Simple Interest Calculator</h3>

<label>Principal:</label>
<input type="number" id="principal"><br><br>

<label>Rate:</label>
<input type="number" id="interest"><br><br>

<label>Time:</label>
<input type="number" id="time"><br><br>

<button onclick="calculateSI()">
Calculate Interest
</button>

<p id="siResult"></p>

<hr>

<h3>Account Type</h3>

<select id="accountType">
<option>Savings</option>
<option>Current</option>
<option>Fixed Deposit</option>
</select>

<button onclick="accountDetails()">
Show Details
</button>

<p id="accountResult"></p>

<hr>

<h3>Interest Table (Loop)</h3>

<button onclick="generateInterestTable()">
Generate Table
</button>

<pre id="tableResult"></pre>
<footer style="background-color: rgb(174, 216, 250); text-align: center; color:darkblue;">
    <p>
        © 2026 Secure Bank Ltd. | All Rights Reserved
    </p>
</footer>
</body>
</html>
