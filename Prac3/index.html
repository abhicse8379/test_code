<!DOCTYPE html>
<html>
<head>
    <title>ShopEase Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="title">ShopEase Online Store</h1>

<button id="themeBtn">Change Theme</button>

<br><br>

<img id="productImg" src="https://via.placeholder.com/200" alt="Product">

<br><br>

<button id="changeImage">Change Image</button>

<h2>Customer Form</h2>

<input type="text" id="name" placeholder="Enter Name">
<p id="message"></p>

<select id="category">
    <option>Select Category</option>
    <option>Mobile</option>
    <option>Laptop</option>
    <option>Accessories</option>
</select>

<p id="categoryText"></p>

<br>

<button id="addItem">Add Product</button>
<button id="removeItem">Remove Product</button>

<ul id="productList">
    <li>Keyboard</li>
    <li>Mouse</li>
</ul>

</body>
<script src="script.js"></script>
</html>
